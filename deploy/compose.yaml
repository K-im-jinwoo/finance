services:
  stock-assistant:
    profiles: ["candidate"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: "${STOCK_IMAGE:-stock-investment-assistant:local}"
    user: "${STOCK_CONTAINER_UID:-1001}:${STOCK_CONTAINER_GID:-1001}"
    read_only: true
    restart: unless-stopped
    command:
      - serve
      - --host
      - 0.0.0.0
      - --port
      - "9120"
      - --database
      - /var/lib/stock/stock-assistant.sqlite3
      - --secret-file
      - /run/secrets/stock-api-key
    expose:
      - "9120"
    volumes:
      - type: bind
        source: "${STOCK_STATE_HOST_DIR:-/srv/stock-assistant/state}"
        target: /var/lib/stock
    secrets:
      - stock-api-key
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    networks:
      - n8n-private
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:9120/health', timeout=3)); assert data['status']=='ok' and data['orders_enabled'] is False"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

secrets:
  stock-api-key:
    file: "${STOCK_API_SHARED_SECRET_HOST_FILE:?required}"

networks:
  n8n-private:
    external: true
    name: "${N8N_DOCKER_NETWORK:-n8n-infra_default}"

