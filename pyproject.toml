[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-research-dashboard"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src", "stock_assistant" = "engine/src/stock_assistant"}

[tool.setuptools.packages.find]
where = ["src", "engine/src"]

